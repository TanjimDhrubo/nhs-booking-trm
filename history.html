<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://js.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://ataqzfyppitexytlitsw.supabase.co https://api.groq.com;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NHS Appointment Booking System — view your complete appointment history. Developed by TRM.">
  <meta name="keywords" content="NHS, appointment, booking, healthcare, TRM, history, appointments">
  <meta name="author" content="TRM">
  <title>NHS Booking — My History</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script>if(localStorage.getItem('trm-theme')==='dark')document.documentElement.classList.add('dark')</script>
  <style>
    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .filter-btn {
      font-size: 13px;
      padding: 7px 18px;
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <nav class="navbar" aria-label="Main navigation">
    <a href="index.html" class="navbar-brand" aria-label="NHS Booking home">
      <div class="navbar-logo" aria-hidden="true">NHS</div>
      <span class="navbar-name"><abbr title="National Health Service" style="text-decoration:none">NHS</abbr> Appointment Booking <span>| TRM</span></span>
    </a>
    <div class="navbar-links">
      <span class="navbar-user" id="user-name"></span>
      <a href="dashboard.html" class="btn-ghost">&larr; Dashboard</a>
      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle dark mode">
        <span class="theme-icon icon-sun" aria-hidden="true">&#9728;</span>
        <span class="theme-icon icon-moon" aria-hidden="true">&#9790;</span>
      </button>
      <button class="btn-ghost" id="logout-btn" aria-label="Sign out of your account">Sign Out</button>
    </div>
  </nav>

  <main id="main-content" class="container">

    <header class="page-header">
      <h1>Appointment History</h1>
      <p>All your NHS appointments</p>
    </header>

    <div id="message" aria-live="polite"></div>

    <section aria-labelledby="heading-filters">
      <h2 id="heading-filters" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Filter appointments</h2>
      <div class="filter-row">
        <button class="btn-primary filter-btn" id="filter-all">All</button>
        <button class="btn-secondary filter-btn" id="filter-upcoming">Upcoming</button>
        <button class="btn-secondary filter-btn" id="filter-past">Past</button>
        <button class="btn-secondary filter-btn" id="filter-cancelled">Cancelled</button>
      </div>
    </section>

    <section aria-labelledby="heading-history-list">
      <h2 id="heading-history-list" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Appointment list</h2>
      <div id="history-list">
        <div class="loading">Loading</div>
      </div>
    </section>

  </main>

  <footer class="site-footer" role="contentinfo">
    <p>
      <span>&copy; 2026 NHS Appointment Booking System</span>
      <span aria-hidden="true">·</span>
      <span class="footer-trm">Developed by <a href="team.html" aria-label="Meet the TRM team">TRM</a></span>
      <span aria-hidden="true">·</span>
      <a href="privacy.html">Privacy Policy</a>
      <span aria-hidden="true">·</span>
      <a href="team.html">Meet the Team</a>
    </p>
  </footer>

  <a href="team.html" class="trm-watermark" aria-label="Meet the TRM team">Developed by TRM</a>

  <script>
    (function(){
      const b=document.getElementById('theme-toggle')||document.getElementById('theme-toggle-menu');
      if(b)b.addEventListener('click',function(){
        const d=document.documentElement.classList.toggle('dark');
        localStorage.setItem('trm-theme',d?'dark':'light');
        const l=document.getElementById('theme-label');
        if(l)l.textContent=d?'On':'Off';
      });
    })();
  </script>

  <script type="module">
    import { supabase } from './js/supabase.js'
    import { requireAuth, showUserName, logout } from './js/auth.js'
    import { formatDate, renderBadge, insertNotification } from './js/helpers.js'


    let allAppointments = []
    let userId = null

    const listEl = document.getElementById('history-list')
    const msgEl = document.getElementById('message')

    const filterAll = document.getElementById('filter-all')
    const filterUpcoming = document.getElementById('filter-upcoming')
    const filterPast = document.getElementById('filter-past')
    const filterCancelled = document.getElementById('filter-cancelled')

    function showMsg(msg, type = 'error') {
      msgEl.innerHTML = ''
      const d = document.createElement('div')
      d.className = 'alert alert-' + type
      d.textContent = msg
      msgEl.appendChild(d)
    }

    function setActiveFilter(active) {
      const btns = [filterAll, filterUpcoming, filterPast, filterCancelled]
      for (const b of btns) {
        b.className = b === active ? 'btn-primary filter-btn' : 'btn-secondary filter-btn'
      }
    }

    function renderHistory(appointments) {
      if (!appointments.length) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">◷</div>
            <p>No appointments to show.</p>
            <a href="book.html" class="btn-primary">Book Now</a>
          </div>`
        return
      }

      let html = '<div class="table-wrap"><table><caption class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Appointment history table</caption><thead><tr><th scope="col">Date &amp; Time</th><th scope="col">Doctor</th><th scope="col">Type</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead><tbody>'

      const now = new Date()

      for (const a of appointments) {
        const doc = a.doctors_trm
        const docName = doc ? doc.name : 'Unknown'
        const apptDate = new Date(a.appointment_date)
        const isFuture = apptDate > now && a.status === 'confirmed'
        const isPastOrCancelled = apptDate < now || a.status === 'cancelled'

        let actions = '<span class="appt-email">&mdash;</span>'
        if (isFuture) {
          actions = '<a href="reschedule.html?appointment_id=' + a.id + '" class="btn-secondary btn-sm">Reschedule</a>'
          actions += '<button class="btn-danger btn-sm cancel-btn" data-id="' + a.id + '" data-date="' + a.appointment_date + '">Cancel</button>'
        }

        html += '<tr>'
        html += '<td><time datetime="' + a.appointment_date + '">' + formatDate(a.appointment_date) + '</time></td>'
        html += '<td>' + docName + '</td>'
        html += '<td>' + a.appointment_type + '</td>'
        html += '<td>' + renderBadge(a.status) + '</td>'
        html += '<td><div class="appt-actions">' + actions + '</div></td>'
        html += '</tr>'
      }

      html += '</tbody></table></div>'
      listEl.innerHTML = html

      document.querySelectorAll('.cancel-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id
          const date = btn.dataset.date

          if (!confirm('Cancel this appointment?')) return

          const { error } = await supabase
            .from('appointments_trm')
            .update({ status: 'cancelled' })
            .eq('id', id)

          if (error) {
            showMsg('Failed to cancel appointment.')
            return
          }

          await insertNotification(userId, 'Your appointment on ' + formatDate(date) + ' has been cancelled')

          showMsg('Appointment cancelled.', 'success')

          await fetchAndRender()
        })
      })
    }

    function applyFilter(filter) {
      setActiveFilter(filter)

      const now = new Date()

      if (filter === filterAll) {
        renderHistory(allAppointments)
      } else if (filter === filterUpcoming) {
        renderHistory(allAppointments.filter(a =>
          new Date(a.appointment_date) > now && a.status === 'confirmed'
        ))
      } else if (filter === filterPast) {
        renderHistory(allAppointments.filter(a =>
          new Date(a.appointment_date) < now
        ))
      } else if (filter === filterCancelled) {
        renderHistory(allAppointments.filter(a =>
          a.status === 'cancelled'
        ))
      }
    }

    async function fetchAndRender() {
      listEl.innerHTML = '<div class="loading">Loading</div>'

      const { data: appts, error } = await supabase
        .from('appointments_trm')
        .select('*, doctors_trm(name, specialisation)')
        .eq('user_id', userId)
        .order('appointment_date', { ascending: false })

      if (error) {
        listEl.innerHTML = '<div class="alert alert-error">Failed to load appointments.</div>'
        return
      }

      allAppointments = appts || []
      applyFilter(filterAll)
    }

    async function init() {
      const session = await requireAuth()
      if (!session) return

      userId = session.user.id
      await showUserName('user-name')

      filterAll.addEventListener('click', () => applyFilter(filterAll))
      filterUpcoming.addEventListener('click', () => applyFilter(filterUpcoming))
      filterPast.addEventListener('click', () => applyFilter(filterPast))
      filterCancelled.addEventListener('click', () => applyFilter(filterCancelled))

      await fetchAndRender()
    }

    document.getElementById('logout-btn').addEventListener('click', logout)

    window.addEventListener('pageshow', async (e) => {
      if (e.persisted) {
        const { data: { session } } = await supabase.auth.getSession()
        if (session) init()
        else window.location.replace('login.html')
      }
    })

    init()
  </script>

</body>
</html>
