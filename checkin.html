<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NHS Appointment Booking System — check in online for your appointment today. Developed by TRM.">
  <meta name="keywords" content="NHS, appointment, booking, healthcare, TRM, check in, queue">
  <meta name="author" content="TRM">
  <title>NHS Booking — Check-In</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script>if(localStorage.getItem('trm-theme')==='dark')document.documentElement.classList.add('dark')</script>
  <style>
    .time-display {
      font-size: 24px;
      font-weight: 700;
      color: var(--nhs-blue);
      min-width: 80px;
      flex-shrink: 0;
    }
    .appt-qr {
      flex-shrink: 0;
    }
    .checkin-done {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      .appt-qr { display: none; }
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <nav class="navbar" aria-label="Main navigation">
    <a href="index.html" class="navbar-brand" aria-label="NHS Booking home">
      <div class="navbar-logo" aria-hidden="true">NHS</div>
      <span class="navbar-name"><abbr title="National Health Service" style="text-decoration:none">NHS</abbr> Appointment Booking <span>| TRM</span></span>
    </a>
    <div class="navbar-links">
      <span class="navbar-user" id="user-name"></span>
      <a href="dashboard.html" class="btn-ghost">&larr; Dashboard</a>
      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle dark mode">
        <span class="theme-icon icon-sun" aria-hidden="true">&#9728;</span>
        <span class="theme-icon icon-moon" aria-hidden="true">&#9790;</span>
      </button>
      <button class="btn-ghost" id="logout-btn" aria-label="Sign out of your account">Sign Out</button>
    </div>
  </nav>

  <main id="main-content" class="container">

    <header class="page-header">
      <h1>Check In</h1>
      <p id="today-label">Today is <time datetime="">&nbsp;</time></p>
    </header>

    <div id="message" aria-live="polite"></div>

    <section aria-labelledby="heading-dependent-select" style="margin-bottom:16px">
      <div class="form-group" style="margin-bottom:0">
        <label for="checkin-for">Checking in for</label>
        <select id="checkin-for">
          <option value="self">Myself</option>
          <option value="dependent">A dependent / family member</option>
        </select>
      </div>
      <div class="form-group" id="checkin-dependent-group" style="display:none;margin-bottom:0">
        <label for="checkin-dependent">Select Dependent</label>
        <select id="checkin-dependent">
          <option value="">Loading dependents...</option>
        </select>
      </div>
    </section>

    <section aria-labelledby="heading-today">
      <h2 id="heading-today">Today's Appointments</h2>
      <div id="today-list">
        <div class="loading">Loading</div>
      </div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section aria-labelledby="heading-upcoming">
      <h2 id="heading-upcoming">Upcoming Appointments</h2>
      <div id="upcoming-list">
        <div class="loading">Loading</div>
      </div>
    </section>

  </main>

  <footer class="site-footer" role="contentinfo">
    <p>
      <span>&copy; 2026 NHS Appointment Booking System</span>
      <span aria-hidden="true">·</span>
      <span class="footer-trm">Developed by <a href="team.html" aria-label="Meet the TRM team">TRM</a></span>
      <span aria-hidden="true">·</span>
      <a href="privacy.html">Privacy Policy</a>
      <span aria-hidden="true">·</span>
      <a href="team.html">Meet the Team</a>
    </p>
  </footer>

  <a href="team.html" class="trm-watermark" aria-label="Meet the TRM team">Developed by TRM</a>

  <script>
    (function(){
      const b=document.getElementById('theme-toggle')||document.getElementById('theme-toggle-menu');
      if(b)b.addEventListener('click',function(){
        const d=document.documentElement.classList.toggle('dark');
        localStorage.setItem('trm-theme',d?'dark':'light');
        const l=document.getElementById('theme-label');
        if(l)l.textContent=d?'On':'Off';
      });
    })();
  </script>

  <script type="module">
    import { supabase } from './js/supabase.js'
    import { requireAuth, showUserName, logout } from './js/auth.js'
    import { formatDate, formatTime, formatTimeShort, renderBadge, getDayBounds, insertNotification } from './js/helpers.js'


    let userId = null
    const msgEl = document.getElementById('message')

    function showMsg(msg, type) {
      msgEl.innerHTML = ''
      const d = document.createElement('div')
      d.className = 'alert alert-' + type
      d.textContent = msg
      msgEl.appendChild(d)
    }

    async function loadTodayAppointments() {
      const el = document.getElementById('today-list')
      el.innerHTML = '<div class="loading">Loading</div>'

      const now = new Date()
      const { start, end } = getDayBounds(now)

      let todayQuery = supabase
        .from('appointments_trm')
        .select('*, doctors_trm(name, specialisation)')
        .eq('user_id', userId)
        .eq('status', 'confirmed')
        .gte('appointment_date', start)
        .lte('appointment_date', end)
        .order('appointment_date')

      if (activeDependentId) {
        todayQuery = todayQuery.eq('dependent_id', activeDependentId)
      } else {
        todayQuery = todayQuery.is('dependent_id', null)
      }

      const { data: appts, error } = await todayQuery

      if (error) {
        el.innerHTML = '<div class="alert alert-error">Failed to load appointments.</div>'
        return
      }

      if (!appts.length) {
        el.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">☑</div>
            <p>No appointments today.</p>
            <a href="book.html" class="btn-primary">Book Now</a>
          </div>`
        return
      }

      let html = ''
      function qrUrl(id) {
        return 'https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=NHS-' + id.slice(0,8).toUpperCase()
      }

      for (const a of appts) {
        const doc = a.doctors_trm
        const docName = doc ? doc.name : 'Unknown'
        const docSpec = doc ? doc.specialisation : ''

        html += '<article class="appt-card" id="appt-' + a.id + '">'
        html += '  <div class="time-display"><time datetime="' + a.appointment_date + '">' + formatTime(a.appointment_date) + '</time></div>'
        html += '  <div class="appt-qr">'
        html += '    <img src="' + qrUrl(a.id) + '" alt="QR code" width="70" height="70" loading="lazy" style="border-radius:6px;border:1px solid var(--border);display:block">'
        html += '  </div>'
        html += '  <div class="appt-info">'
        html += '    <div class="appt-doctor">' + docName + '</div>'
        html += '    <div class="appt-meta">' + docSpec + ' &middot; ' + a.appointment_type + '</div>'
        html += '  </div>'
        html += '  <div class="appt-actions">'
        html += '    <button class="btn-primary checkin-btn" data-id="' + a.id + '" data-doc="' + (doc ? doc.name : '') + '" data-time="' + a.appointment_date + '">Check In Now</button>'
        html += '  </div>'
        html += '</article>'
      }

      el.innerHTML = html

      document.querySelectorAll('.checkin-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const apptId = btn.dataset.id
          const docName = btn.dataset.doc
          const apptTime = btn.dataset.time

          btn.disabled = true
          btn.textContent = 'Processing\u2026'

          const nowStr = new Date().toISOString()

          const { error: checkinErr } = await supabase
            .from('checkins_trm')
            .insert({
              appointment_id: apptId,
              checkin_time: nowStr
            })

          if (checkinErr) {
            showMsg('Check-in failed. Please try again.', 'error')
            btn.disabled = false
            btn.textContent = 'Check In Now'
            return
          }

          const { error: updateErr } = await supabase
            .from('appointments_trm')
            .update({ status: 'checked_in' })
            .eq('id', apptId)

          if (updateErr) {
            showMsg('Check-in failed. Please try again.', 'error')
            btn.disabled = false
            btn.textContent = 'Check In Now'
            return
          }

          await insertNotification(userId, 'You successfully checked in for your appointment with ' + docName + ' at ' + formatTimeShort(apptTime))

          const card = document.getElementById('appt-' + apptId)
          if (card) {
            const actions = card.querySelector('.appt-actions')
            if (actions) {
              actions.innerHTML = '<div class="alert alert-success checkin-done"><span class="sym" aria-hidden="true">✓</span> Checked in at <time datetime="' + nowStr + '">' + formatTimeShort(nowStr) + '</time></div>'
            }
          }
        })
      })
    }

    async function loadUpcomingAppointments() {
      const el = document.getElementById('upcoming-list')
      el.innerHTML = '<div class="loading">Loading</div>'

      const today = new Date()
      const tomorrow = new Date(today)
      tomorrow.setDate(tomorrow.getDate() + 1)
      tomorrow.setHours(0, 0, 0, 0)

      const weekEnd = new Date(today)
      weekEnd.setDate(weekEnd.getDate() + 7)
      weekEnd.setHours(23, 59, 59, 999)

      let weekQuery = supabase
        .from('appointments_trm')
        .select('*, doctors_trm(name, specialisation)')
        .eq('user_id', userId)
        .eq('status', 'confirmed')
        .gte('appointment_date', tomorrow.toISOString())
        .lte('appointment_date', weekEnd.toISOString())
        .order('appointment_date')

      if (activeDependentId) {
        weekQuery = weekQuery.eq('dependent_id', activeDependentId)
      } else {
        weekQuery = weekQuery.is('dependent_id', null)
      }

      const { data: appts, error } = await weekQuery

      if (error) {
        el.innerHTML = '<div class="alert alert-error">Failed to load upcoming appointments.</div>'
        return
      }

      if (!appts.length) {
        el.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">☑</div>
            <p>No upcoming appointments this week.</p>
          </div>`
        return
      }

      let html = ''
      for (const a of appts) {
        const doc = a.doctors_trm
        const docName = doc ? doc.name : 'Unknown'
        const docSpec = doc ? doc.specialisation : ''

        html += '<article class="appt-card">'
        html += '  <div class="appt-info">'
        html += '    <div class="appt-doctor">' + docName + '</div>'
        html += '    <div class="appt-meta">' + docSpec + ' &middot; ' + formatDate(a.appointment_date) + ' &middot; ' + a.appointment_type + '</div>'
        html += '  </div>'
        html += '  <div class="appt-actions">'
        html +=      renderBadge(a.status)
        html += '  </div>'
        html += '</article>'
      }

      el.innerHTML = html
    }

    const checkinFor = document.getElementById('checkin-for')
    const checkinDependentGroup = document.getElementById('checkin-dependent-group')
    const checkinDependent = document.getElementById('checkin-dependent')

    let activeDependentId = null

    checkinFor.addEventListener('change', () => {
      if (checkinFor.value === 'dependent') {
        checkinDependentGroup.style.display = 'block'
        loadCheckinDependents()
      } else {
        checkinDependentGroup.style.display = 'none'
        activeDependentId = null
        reloadAll()
      }
    })

    checkinDependent.addEventListener('change', () => {
      activeDependentId = checkinDependent.value || null
      reloadAll()
    })

    async function loadCheckinDependents() {
      checkinDependent.innerHTML = '<option value="">Loading dependents...</option>'

      const { data: dependents, error } = await supabase
        .from('dependents_trm')
        .select('id, full_name')
        .eq('guardian_id', userId)
        .order('full_name')

      if (error || !dependents || dependents.length === 0) {
        checkinDependent.innerHTML = '<option value="">No dependents added yet</option>'
        return
      }

      checkinDependent.innerHTML = '<option value="">Select a dependent...</option>'
      for (const d of dependents) {
        const opt = document.createElement('option')
        opt.value = d.id
        opt.textContent = d.full_name
        checkinDependent.appendChild(opt)
      }
    }

    function reloadAll() {
      Promise.all([
        loadTodayAppointments(),
        loadUpcomingAppointments()
      ])
    }

    async function init() {
      const session = await requireAuth()
      if (!session) return

      userId = session.user.id

      await showUserName('user-name')

      const today = new Date()
      const todayStr = today.toISOString()
      const labelEl = document.getElementById('today-label')
      labelEl.innerHTML = 'Today is <time datetime="' + todayStr.slice(0,10) + '">' + today.toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }) + '</time>'

      await Promise.all([
        loadTodayAppointments(),
        loadUpcomingAppointments()
      ])
    }

    document.getElementById('logout-btn').addEventListener('click', logout)

    window.addEventListener('pageshow', async (e) => {
      if (e.persisted) {
        const { data: { session } } = await supabase.auth.getSession()
        if (session) init()
        else window.location.replace('login.html')
      }
    })

    init()
  </script>

</body>
</html>
