<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
      <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://js.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://ataqzfyppitexytlitsw.supabase.co https://api.groq.com https://cdn.jsdelivr.net https://unpkg.com https://fonts.googleapis.com https://fonts.gstatic.com;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NHS Appointment Booking System — create an account to book and manage your NHS appointments online. Developed by TRM.">
  <meta name="keywords" content="NHS, appointment, booking, healthcare, TRM, register, sign up">
  <meta name="author" content="TRM">
  <title>NHS Booking — Register</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script>if(localStorage.getItem('trm-theme')==='dark')document.documentElement.classList.add('dark')</script>
</head>
<body class="auth-page">

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div style="position:fixed;top:20px;right:24px;z-index:10">
    <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle dark mode">
      <span class="theme-icon icon-sun" aria-hidden="true">&#9728;</span>
      <span class="theme-icon icon-moon" aria-hidden="true">&#9790;</span>
    </button>
  </div>

  <main id="main-content" class="container-sm">
    <div class="auth-card">

      <header class="auth-header">
        <a href="index.html" class="auth-logo">
          <div class="navbar-logo">NHS</div>
        </a>
        <h1>Create Account</h1>
        <p>Register for NHS Appointment Booking</p>
      </header>

      <div id="message" aria-live="polite"></div>

      <form id="register-form" aria-label="Account registration form">
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" required placeholder="e.g. Jane Smith" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="8" placeholder="Minimum 8 characters" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" required>
        </div>

        <div class="form-group">
          <label for="nhs-number">NHS Number (optional)</label>
          <input type="text" id="nhs-number" placeholder="10-digit NHS number" pattern="[0-9]{10}" maxlength="10" autocomplete="off">
        </div>

        <button type="submit" class="btn-primary" id="register-btn">Create Account</button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>

    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <p>
      <span>&copy; 2026 NHS Appointment Booking System</span>
      <span aria-hidden="true">·</span>
      <span class="footer-trm">Developed by <a href="team.html" aria-label="Meet the TRM team">TRM</a></span>
      <span aria-hidden="true">·</span>
      <a href="privacy.html">Privacy Policy</a>
      <span aria-hidden="true">·</span>
      <a href="team.html">Meet the Team</a>
    </p>
  </footer>

  <a href="team.html" class="trm-watermark" aria-label="Meet the TRM team">Developed by TRM</a>

  <script>
    (function(){
      const b=document.getElementById('theme-toggle')||document.getElementById('theme-toggle-menu');
      if(b)b.addEventListener('click',function(){
        const d=document.documentElement.classList.toggle('dark');
        localStorage.setItem('trm-theme',d?'dark':'light');
        const l=document.getElementById('theme-label');
        if(l)l.textContent=d?'On':'Off';
      });
    })();
  </script>

  <script type="module">
    import { supabase } from './js/supabase.js'


    const form = document.getElementById('register-form')

    form.addEventListener('submit', async function(e) {
      e.preventDefault()
      
      const fullName = document.getElementById('full-name').value.trim()
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const dob = document.getElementById('dob').value
      const nhsNumber = document.getElementById('nhs-number').value.trim()
      const msgDiv = document.getElementById('message')
      const submitBtn = form.querySelector('button[type=submit]')

      if (!fullName || !email || !password || !dob) {
        msgDiv.innerHTML = '<div class="alert alert-error">Please fill in all required fields.</div>'
        return
      }

      if (password.length < 8) {
        msgDiv.innerHTML = '<div class="alert alert-error">Password must be at least 8 characters.</div>'
        return
      }

      const birthDate = new Date(dob)
      const today = new Date()
      const age = today.getFullYear() - birthDate.getFullYear()
      const monthDiff = today.getMonth() - birthDate.getMonth()
      const actualAge = monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate()) ? age - 1 : age
      if (actualAge < 13) {
        msgDiv.innerHTML = '<div class="alert alert-error">You must be at least 13 years old to create an account. This is required by UK data protection law.</div>'
        return
      }

      submitBtn.disabled = true
      submitBtn.textContent = 'Creating account...'
      msgDiv.innerHTML = ''

      try {
        const { data: authData, error: authError } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
              date_of_birth: dob || null,
              nhs_number: nhsNumber || null
            }
          }
        })

        if (authError) {
          msgDiv.innerHTML = ''
          const ae = document.createElement('div')
          ae.className = 'alert alert-error'
          ae.textContent = authError.message
          msgDiv.appendChild(ae)
          submitBtn.disabled = false
          submitBtn.textContent = 'Create Account'
          return
        }

        if (!authData.user) {
          msgDiv.innerHTML = '<div class="alert alert-error">Signup failed. Please try again.</div>'
          submitBtn.disabled = false
          submitBtn.textContent = 'Create Account'
          return
        }

        await new Promise(resolve => setTimeout(resolve, 2000))

        const { data: profile } = await supabase
          .from('profiles_trm')
          .select('nhs_number')
          .eq('id', authData.user.id)
          .single()

        const displayNhs = profile?.nhs_number || nhsNumber || 'auto-generated'

        msgDiv.innerHTML = ''
        const da = document.createElement('div'); da.className = 'alert alert-success'; da.textContent = 'Account created successfully! You can now sign in.'; msgDiv.appendChild(da)
        const card = document.createElement('div'); card.className = 'card'; card.style.cssText = 'margin-top:16px;padding:16px;text-align:center;background:var(--bg-subtle)'; msgDiv.appendChild(card)
        const lbl = document.createElement('p'); lbl.style.cssText = 'font-size:13px;color:var(--nhs-muted);margin-bottom:4px'; lbl.textContent = 'Your NHS Number'; card.appendChild(lbl)
        const nhsEl = document.createElement('p'); nhsEl.style.cssText = 'font-size:22px;font-weight:700;color:var(--nhs-dark);letter-spacing:1px'; nhsEl.textContent = displayNhs.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3'); card.appendChild(nhsEl)
        const tip = document.createElement('p'); tip.style.cssText = 'font-size:12px;color:var(--nhs-muted);margin-top:4px'; tip.textContent = 'Keep this number safe for your appointments'; card.appendChild(tip)
        const lnk = document.createElement('a'); lnk.href = 'login.html'; lnk.className = 'btn-primary'; lnk.style.cssText = 'display:block;text-align:center;margin-top:16px'; lnk.textContent = 'Sign In \u2192'; msgDiv.appendChild(lnk)

        submitBtn.textContent = 'Account Created!'
        
      } catch (err) {
        console.error('Unexpected error:', err)
        msgDiv.innerHTML = '<div class="alert alert-error">An unexpected error occurred. Please try again.</div>'
        submitBtn.disabled = false
        submitBtn.textContent = 'Create Account'
      }
    })
  </script>

</body>
</html>
