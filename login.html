<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NHS Appointment Booking System — sign in to your account to book and manage your NHS appointments online. Developed by TRM.">
  <meta name="keywords" content="NHS, appointment, booking, healthcare, TRM, sign in, login">
  <meta name="author" content="TRM">
  <title>NHS Booking | TRM</title>
  <link rel="stylesheet" href="css/style.css">
  <script>if(localStorage.getItem('trm-theme')==='dark')document.documentElement.classList.add('dark')</script>
  <style>
    .btn-full {
      width: 100%;
      justify-content: center;
    }
    .divider-text {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
      color: var(--nhs-muted);
      font-size: 13px;
    }
    .divider-text::before,
    .divider-text::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .auth-links {
      text-align: center;
      font-size: 13px;
      color: var(--nhs-muted);
    }
    .auth-links a {
      color: var(--nhs-muted);
      text-decoration: none;
    }
    .auth-links a:hover {
      color: var(--nhs-blue);
    }
    .auth-links .sep {
      display: inline-block;
      margin: 0 4px;
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="auth-page" style="position:relative">

    <div style="position:absolute;top:20px;right:24px;z-index:10">
      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle dark mode">
        <span class="theme-icon icon-sun" aria-hidden="true">&#9728;</span>
        <span class="theme-icon icon-moon" aria-hidden="true">&#9790;</span>
      </button>
    </div>

    <main id="main-content">
      <div class="auth-card">

        <header class="auth-logo">
          <div class="navbar-logo">NHS</div>
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to your NHS Booking account | TRM</p>
        </header>

        <div id="message"></div>

        <form id="login-form" aria-label="Sign in form">
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password" required>
          </div>
          <button type="submit" class="btn-primary btn-full" id="submit-btn">Sign In &rarr;</button>
        </form>

        <div class="divider-text">or</div>

        <div class="auth-links">
          Don't have an account? <a href="register.html">Register here</a>
          <span class="sep">·</span>
          <a href="doctors.html">Browse our doctors</a>
        </div>

      </div>
    </main>

    <footer>
      <span>&copy; 2026 NHS Appointment Booking System</span>
      <span aria-hidden="true">·</span>
      <span class="footer-trm">Developed by <a href="team.html" aria-label="Meet the TRM team">TRM</a></span>
      <span aria-hidden="true">·</span>
      <a href="privacy.html">Privacy Policy</a>
      <span aria-hidden="true">·</span>
      <a href="team.html">Meet the Team</a>
    </footer>

    <a href="team.html" class="trm-watermark" aria-label="Meet the TRM team">Developed by TRM</a>

    <script>
      (function(){
        var b=document.getElementById('theme-toggle')||document.getElementById('theme-toggle-menu');
        if(b)b.addEventListener('click',function(){
          var d=document.documentElement.classList.toggle('dark');
          localStorage.setItem('trm-theme',d?'dark':'light');
          var l=document.getElementById('theme-label');
          if(l)l.textContent=d?'On':'Off';
        });
      })();
    </script>

  </div>

  <script type="module">
    import { supabase } from './js/supabase.js'


    const form = document.getElementById('login-form')
    const msgEl = document.getElementById('message')
    const submitBtn = document.getElementById('submit-btn')

    function showMsg(msg, type = 'error') {
      msgEl.innerHTML = '<div class="alert alert-' + type + '">' + msg + '</div>'
    }

    async function redirectIfLoggedIn() {
      const { data: { session } } = await supabase.auth.getSession()
      if (session) {
        window.location.href = 'dashboard.html'
      }
    }

    redirectIfLoggedIn()

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      msgEl.innerHTML = ''

      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value

      if (!email || !password) {
        showMsg('Please fill in both fields.')
        return
      }

      submitBtn.disabled = true
      submitBtn.textContent = 'Signing in\u2026'

      const { error } = await supabase.auth.signInWithPassword({ email, password })

      if (error) {
        showMsg(error.message)
        submitBtn.disabled = false
        submitBtn.innerHTML = 'Sign In &rarr;'
        return
      }

      window.location.href = 'dashboard.html'
    })
  </script>

</body>
</html>
