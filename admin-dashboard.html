<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NHS Appointment Booking System — admin dashboard for doctors to manage patient appointments. Developed by TRM.">
  <meta name="keywords" content="NHS, appointment, booking, healthcare, TRM, admin, doctor dashboard, staff">
  <meta name="author" content="TRM">
  <title>NHS Booking | TRM</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-nav-name span {
      color: var(--nhs-blue);
    }
    .admin-staff-badge {
      display: inline-block;
      background: #FFF8E7;
      color: #856404;
      border: 1px solid #FFE69C;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-left: 8px;
      vertical-align: middle;
    }
    .admin-amber-bar {
      height: 3px;
      background: var(--nhs-amber);
      width: 100%;
    }
    .greeting-large {
      font-size: 28px;
      font-weight: 700;
      color: var(--nhs-dark);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .greeting-spec {
      font-size: 15px;
      color: var(--nhs-muted);
      margin-bottom: 20px;
    }
    .stat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stat-chip {
      background: var(--bg-subtle);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 4px;
      color: var(--nhs-dark);
    }
    .stat-chip strong {
      color: var(--nhs-blue);
      font-size: 15px;
    }
    .section-heading {
      font-size: 22px;
      font-weight: 700;
      color: var(--nhs-dark);
      letter-spacing: -0.4px;
      margin-bottom: 16px;
    }
    .appt-email {
      font-size: 12px;
      color: var(--nhs-muted);
    }
    #message {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <nav class="navbar" aria-label="Main navigation">
    <a href="admin-dashboard.html" class="navbar-brand" aria-label="NHS Admin Portal">
      <div class="navbar-logo" aria-hidden="true">NHS</div>
      <span class="navbar-name admin-nav-name">NHS Admin Portal <a href="team.html" style="color:var(--nhs-blue);text-decoration:none;font-weight:700;display:inline" aria-label="Meet the TRM team">| TRM</a></span>
      <span class="admin-staff-badge">STAFF ONLY</span>
    </a>
    <div class="navbar-links">
      <span class="navbar-user" id="doctor-name"></span>
      <button class="btn-ghost" id="logout-btn" aria-label="Sign out of your account">Sign Out</button>
    </div>
  </nav>

  <div class="admin-amber-bar" aria-hidden="true"></div>

  <main id="main-content" class="container">

    <div id="message"></div>

    <header class="card">
      <div class="greeting-large" id="greeting">Good morning</div>
      <div class="greeting-spec" id="doctor-spec"></div>
      <ul class="stat-chips" style="list-style:none;padding:0;margin:0">
        <li class="stat-chip"><strong id="stat-today">0</strong> appointments today</li>
        <li class="stat-chip"><strong id="stat-week">0</strong> this week</li>
        <li class="stat-chip"><strong id="stat-total">0</strong> total appointments</li>
      </ul>
    </header>

    <section aria-labelledby="today-heading">
      <h2 class="section-heading" id="today-heading">Today's Appointments</h2>
      <div id="today-appointments">
        <div class="loading">Loading</div>
      </div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section aria-labelledby="week-heading">
      <h2 class="section-heading" id="week-heading">This Week</h2>
      <div id="week-appointments">
        <div class="loading">Loading</div>
      </div>
    </section>

  </main>

  <footer>
    <span>&copy; 2026 NHS Appointment Booking System</span>
    <span aria-hidden="true">·</span>
    <span class="footer-trm">Developed by <a href="team.html" aria-label="Meet the TRM team">TRM</a></span>
    <span aria-hidden="true">·</span>
    <a href="privacy.html">Privacy Policy</a>
    <span aria-hidden="true">·</span>
    <a href="team.html">Meet the Team</a>
  </footer>

  <a href="team.html" class="trm-watermark" aria-label="Meet the TRM team">Developed by TRM</a>

  <script type="module">
    import { supabase } from './js/supabase.js'

    let doctorId = null

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric',
        month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      })
    }

    async function loadDoctorProfile(userEmail) {
      const { data, error } = await supabase
        .from('doctors_trm')
        .select('id, name, specialisation')
        .eq('email', userEmail)
        .single()

      if (error || !data) {
        console.error('Doctor not found:', error)
        window.location.href = 'admin-login.html'
        return null
      }
      return data
    }

    async function loadTodayAppointments(doctorId) {
      const todayStart = new Date()
      todayStart.setHours(0, 0, 0, 0)
      const todayEnd = new Date()
      todayEnd.setHours(23, 59, 59, 999)

      const { data, error } = await supabase
        .from('appointments_trm')
        .select('id, appointment_type, appointment_date, status, user_id')
        .eq('doctor_id', doctorId)
        .gte('appointment_date', todayStart.toISOString())
        .lte('appointment_date', todayEnd.toISOString())
        .order('appointment_date', { ascending: true })

      if (error) {
        console.error('Today appointments error:', error)
        return []
      }

      const appointmentsWithPatients = await Promise.all(
        (data || []).map(async (appt) => {
          const { data: profile } = await supabase
            .from('profiles_trm')
            .select('full_name')
            .eq('id', appt.user_id)
            .single()

          return {
            ...appt,
            patient_name: profile ? profile.full_name : 'Unknown Patient'
          }
        })
      )

      return appointmentsWithPatients
    }

    async function loadWeekAppointments(doctorId) {
      const tomorrow = new Date()
      tomorrow.setDate(tomorrow.getDate() + 1)
      tomorrow.setHours(0, 0, 0, 0)

      const weekEnd = new Date()
      weekEnd.setDate(weekEnd.getDate() + 7)
      weekEnd.setHours(23, 59, 59, 999)

      const { data, error } = await supabase
        .from('appointments_trm')
        .select('id, appointment_type, appointment_date, status, user_id')
        .eq('doctor_id', doctorId)
        .gte('appointment_date', tomorrow.toISOString())
        .lte('appointment_date', weekEnd.toISOString())
        .order('appointment_date', { ascending: true })

      if (error) {
        console.error('Week appointments error:', error)
        return []
      }

      const appointmentsWithPatients = await Promise.all(
        (data || []).map(async (appt) => {
          const { data: profile } = await supabase
            .from('profiles_trm')
            .select('full_name')
            .eq('id', appt.user_id)
            .single()

          return {
            ...appt,
            patient_name: profile ? profile.full_name : 'Unknown Patient'
          }
        })
      )

      return appointmentsWithPatients
    }

    function renderAppointments(appointments, containerId, showActions) {
      const container = document.getElementById(containerId)

      if (!appointments || appointments.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>No appointments scheduled.</p>
          </div>`
        return
      }

      const rows = appointments.map(appt => `
        <tr>
          <td>
            <time datetime="${appt.appointment_date}">
              ${formatDate(appt.appointment_date)}
            </time>
          </td>
          <td>${appt.patient_name}</td>
          <td>${appt.appointment_type}</td>
          <td>
            <span class="badge badge-${appt.status}">
              ${appt.status}
            </span>
          </td>
          ${showActions ? `
          <td>
            ${appt.status === 'confirmed' || appt.status === 'checked_in' ? `
              <button class="btn-secondary btn-sm"
                data-id="${appt.id}">
                Mark Complete
              </button>
            ` : `<span style="color:#9CA3AF;font-size:13px">Done</span>`}
          </td>` : '<td>-</td>'}
        </tr>
      `).join('')

      container.innerHTML = `
        <div class="table-wrap">
          <table>
            <caption class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">${containerId === 'today-appointments' ? "Today's" : 'This week\'s'} appointments</caption>
            <thead>
              <tr>
                <th scope="col">Date & Time</th>
                <th scope="col">Patient</th>
                <th scope="col">Type</th>
                <th scope="col">Status</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`

      if (showActions) {
        container.querySelectorAll('button[data-id]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-id')
            btn.disabled = true
            btn.textContent = 'Updating...'

            const { error } = await supabase
              .from('appointments_trm')
              .update({ status: 'completed' })
              .eq('id', id)

            if (error) {
              btn.disabled = false
              btn.textContent = 'Mark Complete'
              alert('Failed to update: ' + error.message)
            } else {
              btn.closest('tr').querySelector('.badge').textContent = 'completed'
              btn.closest('tr').querySelector('.badge').className = 'badge badge-completed'
              btn.closest('td').innerHTML = '<span style="color:#9CA3AF;font-size:13px">Done</span>'
            }
          })
        })
      }
    }

    async function loadStats(doctorId) {
      const { count, error } = await supabase
        .from('appointments_trm')
        .select('id', { count: 'exact', head: true })
        .eq('doctor_id', doctorId)

      if (!error) {
        document.getElementById('stat-total').textContent = count || 0
      }
    }

    async function init() {
      const { data: { session }, error: sessionErr } = await supabase.auth.getSession()
      if (sessionErr || !session) {
        window.location.href = 'admin-login.html'
        return
      }

      const doctor = await loadDoctorProfile(session.user.email)
      if (!doctor) return

      doctorId = doctor.id

      document.getElementById('doctor-name').textContent = doctor.name
      document.getElementById('doctor-spec').textContent = doctor.specialisation

      const hour = new Date().getHours()
      let greeting = 'Good evening'
      if (hour < 12) greeting = 'Good morning'
      else if (hour < 17) greeting = 'Good afternoon'
      document.getElementById('greeting').textContent = greeting + ', ' + doctor.name

      const today = new Date()
      const headingEl = document.getElementById('today-heading')
      headingEl.textContent = "Today's Appointments — " + today.toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      })

      const [todayAppts, weekAppts] = await Promise.all([
        loadTodayAppointments(doctorId),
        loadWeekAppointments(doctorId)
      ])

      document.getElementById('stat-today').textContent = todayAppts.length
      document.getElementById('stat-week').textContent = weekAppts.length

      renderAppointments(todayAppts, 'today-appointments', true)
      renderAppointments(weekAppts, 'week-appointments', false)

      await loadStats(doctorId)
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut()
      window.location.href = 'admin-login.html'
    })

    init()
  </script>

</body>
</html>
