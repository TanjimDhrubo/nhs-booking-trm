<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NHS Appointment Booking System — admin dashboard for doctors to manage patient appointments. Developed by TRM.">
  <meta name="keywords" content="NHS, appointment, booking, healthcare, TRM, admin, doctor dashboard, staff">
  <meta name="author" content="TRM">
  <title>NHS Booking | TRM</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-nav-name span {
      color: var(--nhs-blue);
    }
    .admin-staff-badge {
      display: inline-block;
      background: #FFF8E7;
      color: #856404;
      border: 1px solid #FFE69C;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-left: 8px;
      vertical-align: middle;
    }
    .admin-amber-bar {
      height: 3px;
      background: var(--nhs-amber);
      width: 100%;
    }
    .greeting-large {
      font-size: 28px;
      font-weight: 700;
      color: var(--nhs-dark);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .greeting-spec {
      font-size: 15px;
      color: var(--nhs-muted);
      margin-bottom: 20px;
    }
    .stat-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stat-chip {
      background: var(--bg-subtle);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 4px;
      color: var(--nhs-dark);
    }
    .stat-chip strong {
      color: var(--nhs-blue);
      font-size: 15px;
    }
    .section-heading {
      font-size: 22px;
      font-weight: 700;
      color: var(--nhs-dark);
      letter-spacing: -0.4px;
      margin-bottom: 16px;
    }
    .appt-email {
      font-size: 12px;
      color: var(--nhs-muted);
    }
    #message {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <nav class="navbar" aria-label="Main navigation">
    <a href="admin-dashboard.html" class="navbar-brand" aria-label="NHS Admin Portal">
      <div class="navbar-logo" aria-hidden="true">NHS</div>
      <span class="navbar-name admin-nav-name">NHS Admin Portal <a href="team.html" style="color:var(--nhs-blue);text-decoration:none;font-weight:700;display:inline" aria-label="Meet the TRM team">| TRM</a></span>
      <span class="admin-staff-badge">STAFF ONLY</span>
    </a>
    <div class="navbar-links">
      <span class="navbar-user" id="doctor-name"></span>
      <button class="btn-ghost" id="logout-btn" aria-label="Sign out of your account">Sign Out</button>
    </div>
  </nav>

  <div class="admin-amber-bar" aria-hidden="true"></div>

  <main id="main-content" class="container">

    <div id="message"></div>

    <header class="card">
      <div class="greeting-large" id="greeting-text">Good morning</div>
      <div class="welcome-subtitle" id="doctor-spec"></div>
      <ul class="stat-chips" style="list-style:none;padding:0;margin:0">
        <li class="stat-chip"><strong id="stat-today">0</strong> appointments today</li>
        <li class="stat-chip"><strong id="stat-week">0</strong> this week</li>
        <li class="stat-chip"><strong id="stat-total">0</strong> total appointments</li>
      </ul>
    </header>

    <section aria-labelledby="today-heading">
      <h2 class="section-heading" id="today-heading">Today's Appointments</h2>
      <div id="today-appointments">
        <div class="loading">Loading</div>
      </div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section aria-labelledby="week-heading">
      <h2 class="section-heading" id="week-heading">This Week</h2>
      <div id="week-appointments">
        <div class="loading">Loading</div>
      </div>
    </section>

  </main>

  <footer>
    <span>&copy; 2026 NHS Appointment Booking System</span>
    <span aria-hidden="true">·</span>
    <span class="footer-trm">Developed by <a href="team.html" aria-label="Meet the TRM team">TRM</a></span>
    <span aria-hidden="true">·</span>
    <a href="privacy.html">Privacy Policy</a>
    <span aria-hidden="true">·</span>
    <a href="team.html">Meet the Team</a>
  </footer>

  <a href="team.html" class="trm-watermark" aria-label="Meet the TRM team">Developed by TRM</a>

  <script type="module">
    import { supabase } from './js/supabase.js'

    console.log('Admin dashboard starting...')

    const { data: { session } } = await supabase.auth.getSession()
    console.log('Session:', session)

    if (!session) {
      console.log('No session, redirecting to login')
      window.location.href = 'admin-login.html'
    }

    const userEmail = session.user.email
    console.log('Logged in as:', userEmail)

    const { data: doctor, error: doctorError } = await supabase
      .from('doctors_trm')
      .select('id, name, specialisation')
      .eq('email', userEmail)
      .single()

    console.log('Doctor lookup result:', doctor, doctorError)

    if (doctorError || !doctor) {
      console.error('Doctor not found, redirecting')
      window.location.href = 'admin-login.html'
    }

    document.getElementById('doctor-name').textContent = doctor.name

    const hour = new Date().getHours()
    let greeting = 'Good evening'
    if (hour < 12) greeting = 'Good morning'
    else if (hour < 17) greeting = 'Good afternoon'
    document.getElementById('greeting-text').textContent = 
      greeting + ', ' + doctor.name

    const specEl = document.querySelector('.welcome-subtitle')
    if (specEl) specEl.textContent = doctor.specialisation

    console.log('Doctor ID for queries:', doctor.id)

    // Load today's appointments
    const todayStart = new Date()
    todayStart.setHours(0, 0, 0, 0)
    const todayEnd = new Date()
    todayEnd.setHours(23, 59, 59, 999)

    console.log('Today range:', todayStart.toISOString(), todayEnd.toISOString())

    const { data: todayAppts, error: todayError } = await supabase
      .from('appointments_trm')
      .select('id, appointment_type, appointment_date, status, user_id')
      .eq('doctor_id', doctor.id)
      .gte('appointment_date', todayStart.toISOString())
      .lte('appointment_date', todayEnd.toISOString())
      .order('appointment_date', { ascending: true })

    console.log('Today appointments raw:', todayAppts, todayError)

    // Get patient names for today's appointments
    let todayWithNames = []
    if (todayAppts && todayAppts.length > 0) {
      for (const appt of todayAppts) {
        const { data: profile, error: profileError } = await supabase
          .from('profiles_trm')
          .select('full_name')
          .eq('id', appt.user_id)
          .single()
        
        console.log('Profile lookup for', appt.user_id, ':', profile, profileError)
        
        todayWithNames.push({
          ...appt,
          patient_name: profile ? profile.full_name : 'Unknown Patient'
        })
      }
    }

    console.log('Today with names:', todayWithNames)

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric',
        month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      })
    }

    function renderTable(appointments, containerId, showActions) {
      const container = document.getElementById(containerId)
      
      if (!appointments || appointments.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No appointments scheduled.</p></div>'
        return
      }

      let rows = ''
      appointments.forEach(appt => {
        rows += '<tr>'
        rows += '<td><time datetime="' + appt.appointment_date + '">' + formatDate(appt.appointment_date) + '</time></td>'
        rows += '<td>' + appt.patient_name + '</td>'
        rows += '<td>' + appt.appointment_type + '</td>'
        rows += '<td><span class="badge badge-' + appt.status + '">' + appt.status + '</span></td>'
        if (showActions) {
          if (appt.status === 'confirmed' || appt.status === 'checked_in') {
            rows += '<td><button class="btn-secondary btn-sm mark-complete-btn" data-id="' + appt.id + '">Mark Complete</button></td>'
          } else {
            rows += '<td><span style="color:#9CA3AF;font-size:13px">Done</span></td>'
          }
        } else {
          rows += '<td>-</td>'
        }
        rows += '</tr>'
      })

      container.innerHTML = '<div class="table-wrap"><table><caption class="sr-only">Appointments list</caption><thead><tr><th scope="col">Date & Time</th><th scope="col">Patient</th><th scope="col">Type</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead><tbody>' + rows + '</tbody></table></div>'

      if (showActions) {
        container.querySelectorAll('.mark-complete-btn').forEach(btn => {
          btn.addEventListener('click', async function() {
            const id = btn.getAttribute('data-id')
            btn.disabled = true
            btn.textContent = 'Updating...'
            const { error } = await supabase
              .from('appointments_trm')
              .update({ status: 'completed' })
              .eq('id', id)
            if (error) {
              alert('Error: ' + error.message)
              btn.disabled = false
              btn.textContent = 'Mark Complete'
            } else {
              location.reload()
            }
          })
        })
      }
    }

    renderTable(todayWithNames, 'today-appointments', true)
    document.getElementById('stat-today').textContent = todayWithNames.length

    // Load week appointments
    const tomorrow = new Date()
    tomorrow.setDate(tomorrow.getDate() + 1)
    tomorrow.setHours(0, 0, 0, 0)
    const weekEnd = new Date()
    weekEnd.setDate(weekEnd.getDate() + 7)
    weekEnd.setHours(23, 59, 59, 999)

    const { data: weekAppts, error: weekError } = await supabase
      .from('appointments_trm')
      .select('id, appointment_type, appointment_date, status, user_id')
      .eq('doctor_id', doctor.id)
      .gte('appointment_date', tomorrow.toISOString())
      .lte('appointment_date', weekEnd.toISOString())
      .order('appointment_date', { ascending: true })

    console.log('Week appointments raw:', weekAppts, weekError)

    let weekWithNames = []
    if (weekAppts && weekAppts.length > 0) {
      for (const appt of weekAppts) {
        const { data: profile } = await supabase
          .from('profiles_trm')
          .select('full_name')
          .eq('id', appt.user_id)
          .single()
        
        weekWithNames.push({
          ...appt,
          patient_name: profile ? profile.full_name : 'Unknown Patient'
        })
      }
    }

    renderTable(weekWithNames, 'week-appointments', false)
    document.getElementById('stat-week').textContent = weekWithNames.length

    // Total count
    const { count, error: countError } = await supabase
      .from('appointments_trm')
      .select('*', { count: 'exact', head: true })
      .eq('doctor_id', doctor.id)

    console.log('Total count:', count, countError)
    document.getElementById('stat-total').textContent = count || 0

    // Logout
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut()
      window.location.href = 'admin-login.html'
    })

    console.log('Admin dashboard fully loaded')
  </script>

</body>
</html>
